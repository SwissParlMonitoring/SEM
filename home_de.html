<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Migration & Asyl - Parlamentarisches Monitoring</title>
    <meta name="theme-color" content="#2D6A8F">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="container header-content">
            <div class="header-main">
                <h1><a href="home_de.html" style="color: inherit; text-decoration: none;">🏛️ Migration & Asyl im Parlament</a></h1>
                <nav>
                    <a href="home_de.html" class="active">Home</a>
                    <a href="objects_de.html">Vorstösse</a>
                    <a href="debates_de.html">Debatten</a>
                    <a href="stats_de.html">Statistiken</a>
                </nav>
            </div>
            <div class="lang-switcher">
                <a href="home.html">FR</a>
                <span>|</span>
                <a href="home_de.html" class="active">DE</a>
            </div>
        </div>
    </header>

    <main class="container">
        <!-- Hero Banner -->
        <div class="hero-banner" id="heroBanner">
            <h2 id="summaryTitle">Laden...</h2>
        </div>

        <!-- Section Objets -->
        <section class="home-section">
            <h2>📋 Neueste Vorstösse</h2>
            <p id="summaryText" class="session-text"></p>
            <div id="objectsList" class="home-cards">
                <p>Vorstösse werden geladen...</p>
            </div>
            <a href="objects_de.html" id="btnViewObjects" class="btn-view-all">Alle Vorstösse anzeigen →</a>
        </section>

        <!-- Section Débats -->
        <section class="home-section">
            <h2>💬 Neueste Debatten</h2>
            <div id="debatesSummary" class="session-summary-home">
                <p>Laden...</p>
            </div>
            <a href="debates_de.html" id="btnViewDebates" class="btn-view-all">Alle Debatten anzeigen →</a>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>Daten: <a href="https://ws-old.parlament.ch/" target="_blank">API des Schweizer Parlaments</a></p>
            <p>Quelle: <a href="https://github.com/SwissParlMonitoring/SEM" target="_blank">GitHub</a></p>
        </div>
    </footer>

    <button id="scrollTopBtn" class="scroll-top-btn" title="Nach oben">↑</button>
    <script>window.LANG = 'de';</script>
    <script src="home.js"></script>
    <script>
        const scrollBtn = document.getElementById('scrollTopBtn');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 300) {
                scrollBtn.classList.add('visible');
            } else {
                scrollBtn.classList.remove('visible');
            }
        });
        scrollBtn.addEventListener('click', () => {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });
    </script>
</body>
</html>
