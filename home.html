<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Migration & Asile - Monitoring parlementaire</title>
    <meta name="theme-color" content="#2D6A8F">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="container header-content">
            <div class="header-main">
                <h1><a href="home.html" style="color: inherit; text-decoration: none;">🏛️ SEM</a></h1>
                <nav>
                    <a href="home.html" class="active">Accueil</a>
                    <a href="objects.html">Objets</a>
                    <a href="debates.html">Débats</a>
                    <a href="stats.html">Statistiques</a>
                </nav>
            </div>
            <div class="lang-switcher">
                <a href="home.html" class="active">FR</a>
                <span>|</span>
                <a href="home_de.html">DE</a>
            </div>
        </div>
    </header>

    <main class="container">
        <!-- Session Animation -->
        <div id="sessionAnimation" class="session-animation" style="display:none;">
            <div class="session-pixel-container">
                <span class="session-badge"><span class="pulse-dot"></span> Session en cours</span>
                <h2 id="sessionTitlePixel"></h2>
                <p id="sessionDatePixel"></p>
            </div>
        </div>

        <!-- Hero Banner -->
        <div class="hero-banner" id="heroBanner">
            <h2 id="summaryTitle">Chargement...</h2>
        </div>

        <!-- Section Objets -->
        <section class="home-section">
            <h2>📋 Derniers objets</h2>
            <p id="summaryText" class="session-text"></p>
            <div id="objectsList" class="home-cards">
                <p>Chargement des interventions...</p>
            </div>
            <a href="objects.html" id="btnViewObjects" class="btn-view-all">Voir tous les objets →</a>
        </section>

        <!-- Section Débats -->
        <section class="home-section">
            <h2>💬 Derniers débats</h2>
            <div id="debatesSummary" class="session-summary-home">
                <p>Chargement...</p>
            </div>
            <a href="debates.html" id="btnViewDebates" class="btn-view-all">Voir tous les débats →</a>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>Données: <a href="https://ws-old.parlament.ch/" target="_blank">API du Parlement suisse</a></p>
            <p>Source: <a href="https://github.com/ArnaudBon20/SwissParlMonitoring" target="_blank">GitHub</a></p>
        </div>
    </footer>

    <button id="scrollTopBtn" class="scroll-top-btn" title="Retour en haut">↑</button>
    <script src="home.js"></script>
    <script>
        const scrollBtn = document.getElementById('scrollTopBtn');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 300) {
                scrollBtn.classList.add('visible');
            } else {
                scrollBtn.classList.remove('visible');
            }
        });
        scrollBtn.addEventListener('click', () => {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });
    </script>
</body>
</html>
